<style>
  :root {
    --bg-base: #0B0F12;
    --surface: rgba(20, 27, 32, 0.88);
    --surface-card: rgba(26, 35, 42, 0.85);
    --border-color: rgba(255, 255, 255, 0.1);
    --text-main: #EAEFF2;
    --text-muted: #8E9EA7;
    --accent: #E29D2B;
    --whatsapp: #25D366;

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background-color: var(--bg-base);
    color: var(--text-main);
    font-family: "IBM Plex Sans", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    overflow-x: hidden;
  }

  /* Animated Civil Site Canvas */
  #site-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: -1;
    pointer-events: none;
  }

  .card-container {
    width: 100%;
    max-width: 32rem;
    background: var(--surface);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 2.5rem 2rem;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
    backdrop-filter: blur(16px);
    position: relative;
    z-index: 10;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    color: var(--text-muted);
    text-decoration: none;
    font-size: 0.88rem;
    margin-bottom: 1.5rem;
    transition: all 0.25s ease;
  }
  .back-btn:hover {
    color: var(--accent);
    transform: translateX(-4px);
  }

  h1 {
    font-family: "Space Grotesk", sans-serif;
    font-size: 1.8rem;
    margin: 0 0 0.3rem;
    color: #FFF;
  }
  .subtitle {
    color: var(--text-muted);
    font-size: 0.95rem;
    margin: 0 0 2rem;
  }

  .links-list {
    display: flex;
    flex-direction: column;
    gap: 1.1rem;
  }

  /* Contact Link Animations */
  .contact-link {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--surface-card);
    border: 1px solid var(--border-color);
    padding: 1rem 1.25rem;
    border-radius: 12px;
    color: var(--text-main);
    text-decoration: none;
    overflow: hidden;
    transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .contact-link::before {
    content: '';
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, rgba(226, 157, 43, 0.08), transparent);
    transition: left 0.6s ease;
  }

  .contact-link.wa-link::before {
    background: linear-gradient(90deg, transparent, rgba(37, 211, 102, 0.08), transparent);
  }

  .contact-link:hover::before {
    left: 100%;
  }

  .contact-link:hover {
    border-color: var(--accent);
    transform: translateY(-4px) scale(1.01);
    box-shadow: 0 12px 25px rgba(226, 157, 43, 0.22),
                0 0 15px rgba(226, 157, 43, 0.15);
    background: rgba(35, 47, 56, 0.95);
  }

  .contact-link.wa-link:hover {
    border-color: var(--whatsapp);
    box-shadow: 0 12px 25px rgba(37, 211, 102, 0.22),
                0 0 15px rgba(37, 211, 102, 0.15);
  }

  .contact-link:active {
    transform: translateY(-1px) scale(0.99);
  }

  .link-info {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .link-icon {
    width: 44px;
    height: 44px;
    background: rgba(226, 157, 43, 0.12);
    color: var(--accent);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    border: 1px solid rgba(226, 157, 43, 0.2);
    transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .link-icon.wa-icon {
    background: rgba(37, 211, 102, 0.12);
    color: var(--whatsapp);
    border-color: rgba(37, 211, 102, 0.2);
  }

  .contact-link:hover .link-icon {
    background: var(--accent);
    color: #0B0F12;
    transform: rotate(-8deg) scale(1.12);
    box-shadow: 0 5px 12px rgba(226, 157, 43, 0.4);
  }

  .contact-link.wa-link:hover .link-icon {
    background: var(--whatsapp);
    color: #0B0F12;
    box-shadow: 0 5px 12px rgba(37, 211, 102, 0.4);
  }

  .link-title {
    font-weight: 600;
    font-size: 0.98rem;
    display: block;
    color: #FFF;
    transition: color 0.2s;
  }
  .contact-link:hover .link-title { color: var(--accent); }

  .link-detail {

  .arrow {
    color: var(--text-muted);
    font-size: 1.1rem;
    transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

    transform: translateX(6px) scale(1.2);
    color: var(--accent);
  }
  .contact-link.wa-link:hover .arrow { color: var(--whatsapp); }
</style>

<script>
  // Civil Engineering Animated Canvas
  const canvas = document.getElementById('site-canvas');
  const ctx = canvas.getContext('2d');
  let width, height;

  function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  let craneAngle = 0;

  function drawCrane(x, y, scale, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.strokeStyle = 'rgba(226, 157, 43, 0.25)';
    ctx.fillStyle = 'rgba(226, 157, 43, 0.25)';
    ctx.lineWidth = 1.5;

    // Tower Body
    ctx.beginPath();
    ctx.moveTo(-15, 0); ctx.lineTo(-10, -250);
    ctx.lineTo(10, -250); ctx.lineTo(15, 0);
    ctx.stroke();

    // Lattice Work
    for(let i = 0; i < 250; i += 20) {
      ctx.beginPath();
      ctx.moveTo(-12, -i); ctx.lineTo(12, -i - 20);
      ctx.moveTo(12, -i); ctx.lineTo(-12, -i - 20);
      ctx.stroke();
    }

    // Top Cabin & Arm Pivot
    ctx.translate(0, -250);
    
    // Rotating Arm (Jib)
    ctx.rotate(angle);
    ctx.beginPath();
    // Jib Main Arm
    ctx.moveTo(-60, -10); ctx.lineTo(200, -10);
    ctx.lineTo(200, 0); ctx.lineTo(-60, 0);
    // Tower Apex
    ctx.moveTo(0, -10); ctx.lineTo(-10, -40); ctx.lineTo(10, -10);
    // Cables
    ctx.moveTo(-10, -40); ctx.lineTo(180, -10);
    ctx.moveTo(-10, -40); ctx.lineTo(-55, -10);
    ctx.stroke();

    // Hook Line
    const hookX = 120 + Math.sin(Date.now() * 0.002) * 20;
    ctx.beginPath();
    ctx.moveTo(hookX, 0); ctx.lineTo(hookX, 80);
    ctx.stroke();

    // Hook Payload Box
    ctx.strokeRect(hookX - 8, 80, 16, 16);

    ctx.restore();
  }

  function drawBuildings() {
    ctx.strokeStyle = 'rgba(0, 119, 255, 0.08)';
    ctx.lineWidth = 1;

    // Grid Floor / Blueprint Line
    ctx.beginPath();
    ctx.moveTo(0, height - 50);
    ctx.lineTo(width, height - 50);
    ctx.stroke();

    // Structural Building Outlines
    const b1X = width * 0.1;
    ctx.strokeRect(b1X, height - 350, 140, 300);
    for(let y = height - 330; y < height - 60; y += 30) {
      for(let x = b1X + 15; x < b1X + 120; x += 25) {
        ctx.strokeRect(x, y, 15, 20);
      }
    }

    const b2X = width * 0.75;
    ctx.strokeRect(b2X, height - 480, 180, 430);
    for(let y = height - 460; y < height - 60; y += 40) {
      for(let x = b2X + 20; x < b2X + 150; x += 35) {
        ctx.strokeRect(x, y, 22, 28);
      }
    }
  }

  function animate() {
    ctx.clearRect(0, 0, width, height);

    // Draw Concrete / Structural Grid
    drawBuildings();

    // Animated Cranes
    craneAngle = Math.sin(Date.now() * 0.0008) * 0.15;
    
    // Left Crane
    drawCrane(width * 0.18, height - 50, 0.9, craneAngle);
    // Right Crane
    drawCrane(width * 0.82, height - 50, 1.1, -craneAngle * 0.8);

    requestAnimationFrame(animate);
  }

  animate();
</script>
